# Build the .xdc and attach it to a GitHub Release when a vX.Y.Z tag (or a
# vX.Y.Z-pre.N pre-release tag) is pushed. The release notes are the tag's
# section of CHANGELOG.md.
name: Release .xdc
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    # A test that leaks a timer hangs `npm test` (see AGENTS.md); fail instead.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24: `npm test` runs the .ts test files directly via native type
          # stripping (node --test), which needs Node 24. Match ci.yml.
          node-version: 24
          cache: npm
      - name: Install
        # See ci.yml: nested vite@8/rolldown optional wasm32 subtree breaks
        # `npm ci`; `npm install` resolves from the lock and tolerates it.
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Release notes
        # The lines under `## [X.Y.Z]` up to the next `## [`; fail if none.
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { p = index($0, "[" v "]") } p && !/^## \[/' CHANGELOG.md > release-notes.md
          grep -q . release-notes.md
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.xdc
          fail_on_unmatched_files: true
          body_path: release-notes.md
          # v0.5.0-beta.1 and the like go out as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
